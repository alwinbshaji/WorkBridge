{% include 'header.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reply to Complaint</title>
    <br><br>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

:root{
--navy:#0a192f;
--navy-light:#1e2a47;
}

body{
background:#f4f6fb;
}

.reply-card{
max-width:700px;
margin:auto;
margin-top:60px;
border:none;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.card-header{
background:var(--navy);
color:white;
font-weight:600;
font-size:18px;
border-radius:12px 12px 0 0 !important;
}

.btn-reply{
background:var(--navy);
color:white;
border:none;
}

.btn-reply:hover{
background:var(--navy-light);
}

</style>

</head>

<body>

<div class="container">

<div class="card reply-card">

<div class="card-header"><br>
    <br>

Reply to User Complaint
</div>

<div class="card-body">

<form method="post">

{% csrf_token %}

<div class="mb-3">
<label class="form-label">Complaint</label>
<textarea class="form-control" rows="3" readonly>
{{ data.content }}
</textarea>
</div>

<div class="mb-3">
<label class="form-label">Reply</label>
<textarea name="reply" class="form-control" rows="4" placeholder="Enter your reply here..." required></textarea>
</div>

<div class="text-end">
<button type="submit" class="btn btn-reply px-4">
Send Reply
</button>
</div>

</form>

</div>

</div>

</div>

</body>
</html>

{% include 'footer.html' %}
