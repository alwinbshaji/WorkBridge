<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  <div class="container">
    <h2 class="mb-4">Add category</h2>
    <form action="/myapp/edit_category_post" method="post">
        <input type="hidden" name="cid" value="{{ data.id }}">
      <div class="row mb-3">
        <label for="type" class="col-sm-4 ">Type</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="type"  name="type" value="{{ data.type }}" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">submit</button>
        </div>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
